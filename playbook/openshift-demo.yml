---
- name: Diagnose Crashing Pod
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Get crashing pods
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: aap
        field_selectors:
          - status.phase!=Running

      register: pods

    - name: Display crashing pods
      ansible.builtin.debug:
        msg: "CRASHING PODS : {{ item.metadata.name }}"
      loop: "{{ pods.resources }}"
      loop_control:
        label: ""
      when:
        - item.status.containerStatuses is defined
        - item.status.containerStatuses | selectattr('state.waiting.reason', 'defined') | selectattr('state.waiting.reason', 'equalto', 'CrashLoopBackOff') | list | length > 0
