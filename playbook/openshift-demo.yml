---
- name: Diagnose Crashing Pod
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Get crashing pods
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: aap
      register: pods
      no_log: true

    - name: Display crashing pods
      ansible.builtin.debug:
        msg: "CRASHING PODS : {{ pods.resources | selectattr('metadata.name', 'equalto', 'crashing-pod-test') | map(attribute='metadata.name') | join(', ') }}"
