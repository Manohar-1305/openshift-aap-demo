---
- name: OpenShift Must-Gather
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    must_gather_dir: /tmp/openshift-must-gather
    must_gather_archive: /tmp/openshift-must-gather.tar.gz
    bastion_host: bastion.ocp.manohar.in
    bastion_user: root
    bastion_dir: /tmp/openshift-must-gather

  tasks:

    - name: Verify OpenShift authentication
      ansible.builtin.command:
        cmd: >
          oc login
          --server={{ lookup('env', 'K8S_AUTH_HOST') }}
          --token={{ lookup('env', 'K8S_AUTH_API_KEY') }}
          --insecure-skip-tls-verify=true
      register: oc_login
      changed_when: false
      no_log: true

    - name: Verify OpenShift user
      ansible.builtin.command:
        cmd: oc whoami
      register: oc_user
      changed_when: false

    - name: Display OpenShift user
      ansible.builtin.debug:
        msg: "Authenticated as: {{ oc_user.stdout }}"

    - name: Create Must-Gather directory
      ansible.builtin.file:
        path: "{{ must_gather_dir }}"
        state: directory
        mode: "0755"

    - name: Run OpenShift Must-Gather
      ansible.builtin.command:
        cmd: oc adm must-gather --dest-dir={{ must_gather_dir }}
      register: must_gather
      changed_when: true

    - name: Create Must-Gather archive
      ansible.builtin.archive:
        path: "{{ must_gather_dir }}/"
        dest: "{{ must_gather_archive }}"
        format: gz
        mode: "0644"

    - name: Create destination directory on bastion
      ansible.builtin.shell:
        cmd: >
          sshpass -p "$BASTION_PASSWORD"
          ssh -o StrictHostKeyChecking=no
          {{ bastion_user }}@{{ bastion_host }}
          "mkdir -p {{ bastion_dir }}"
      environment:
        BASTION_PASSWORD: "{{ lookup('env', 'BASTION_PASSWORD') }}"
      no_log: true

    - name: Copy Must-Gather archive to bastion
      ansible.builtin.shell:
        cmd: >
          sshpass -p "$BASTION_PASSWORD"
          scp -o StrictHostKeyChecking=no
          {{ must_gather_archive }}
          {{ bastion_user }}@{{ bastion_host }}:{{ bastion_dir }}/
      environment:
        BASTION_PASSWORD: "{{ lookup('env', 'BASTION_PASSWORD') }}"
      no_log: true

    - name: Display Must-Gather location
      ansible.builtin.debug:
        msg: "Must-Gather saved on bastion: {{ bastion_dir }}/openshift-must-gather.tar.gz"
