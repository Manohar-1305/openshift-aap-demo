---
- name: Run OpenShift Must-Gather
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    must_gather_dir: /tmp/openshift-must-gather
    must_gather_archive: /tmp/openshift-must-gather.tar.gz

  tasks:

    - name: Login to OpenShift
      ansible.builtin.command:
        cmd: >
          oc login
          --server={{ lookup('env', 'K8S_AUTH_HOST') }}
          --token={{ lookup('env', 'K8S_AUTH_API_KEY') }}
          --insecure-skip-tls-verify=true
      no_log: true
      changed_when: false

    - name: Remove previous Must-Gather directory
      ansible.builtin.file:
        path: "{{ must_gather_dir }}"
        state: absent

    - name: Remove previous archive
      ansible.builtin.file:
        path: "{{ must_gather_archive }}"
        state: absent

    - name: Create Must-Gather directory
      ansible.builtin.file:
        path: "{{ must_gather_dir }}"
        state: directory
        mode: "0755"

    - name: Run OpenShift Must-Gather
      ansible.builtin.command:
        cmd: oc adm must-gather --dest-dir={{ must_gather_dir }}
      register: must_gather
      changed_when: true

    - name: Create Must-Gather archive
      ansible.builtin.command:
        cmd: tar -czf {{ must_gather_archive }} -C {{ must_gather_dir }} .
      changed_when: true

- name: Save Must-Gather on Bastion
  hosts: bastion
  gather_facts: false
  become: true

  vars:
    bastion_dir: /tmp/openshift-must-gather

  tasks:

    - name: Create Must-Gather directory on bastion
      ansible.builtin.file:
        path: "{{ bastion_dir }}"
        state: directory
        mode: "0755"

    - name: Copy Must-Gather archive to bastion
      ansible.builtin.copy:
        src: /tmp/openshift-must-gather.tar.gz
        dest: "{{ bastion_dir }}/openshift-must-gather.tar.gz"
        mode: "0644"

    - name: Verify archive
      ansible.builtin.stat:
        path: "{{ bastion_dir }}/openshift-must-gather.tar.gz"
      register: archive

    - name: Display archive
      ansible.builtin.debug:
        msg: "Saved: {{ bastion_dir }}/openshift-must-gather.tar.gz ({{ archive.stat.size }} bytes)"
