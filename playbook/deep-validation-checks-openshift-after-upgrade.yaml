---
- name: OpenShift Post-Upgrade Validation
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    validation_log: /tmp/openshift-post-upgrade-validation.log

  tasks:

    - name: Login to OpenShift
      ansible.builtin.command:
        cmd: >
          oc login
          --server={{ lookup('env', 'K8S_AUTH_HOST') }}
          --token={{ lookup('env', 'K8S_AUTH_API_KEY') }}
          --insecure-skip-tls-verify=true
      changed_when: false
      no_log: true

    - name: Get ClusterVersion
      ansible.builtin.command:
        cmd: oc get clusterversion version -o json
      register: cluster_version
      changed_when: false

    - name: Get ClusterOperators
      ansible.builtin.command:
        cmd: oc get clusteroperators -o json
      register: cluster_operators
      changed_when: false

    - name: Get ClusterOperators summary
      ansible.builtin.command:
        cmd: oc get clusteroperators
      register: operators_summary
      changed_when: false

    - name: Get MachineConfigPools
      ansible.builtin.command:
        cmd: oc get machineconfigpools -o json
      register: machine_config_pools
      changed_when: false

    - name: Get MachineConfigPools summary
      ansible.builtin.command:
        cmd: oc get mcp
      register: mcp_summary
      changed_when: false

    - name: Get Nodes
      ansible.builtin.command:
        cmd: oc get nodes -o json
      register: cluster_nodes
      changed_when: false

    - name: Get Nodes summary
      ansible.builtin.command:
        cmd: oc get nodes
      register: nodes_summary
      changed_when: false

    - name: Get CSRs
      ansible.builtin.command:
        cmd: oc get csr -o json
      register: csrs
      changed_when: false

    - name: Get all Pods
      ansible.builtin.command:
        cmd: oc get pods -A -o json
      register: all_pods
      changed_when: false

    - name: Get Infrastructure
      ansible.builtin.command:
        cmd: oc get infrastructure cluster -o json
      register: infrastructure
      changed_when: false

    - name: Get DNS
      ansible.builtin.command:
        cmd: oc get dns cluster -o json
      register: dns
      changed_when: false

    - name: Get Network
      ansible.builtin.command:
        cmd: oc get network cluster -o json
      register: network
      changed_when: false

    - name: Get Ingress
      ansible.builtin.command:
        cmd: oc get ingresscontroller -n openshift-ingress-operator -o json
      register: ingress
      changed_when: false

    - name: Get Authentication
      ansible.builtin.command:
        cmd: oc get clusteroperator authentication -o json
      register: authentication
      changed_when: false

    - name: Get Console
      ansible.builtin.command:
        cmd: oc get clusteroperator console -o json
      register: console
      changed_when: false

    - name: Get StorageClasses
      ansible.builtin.command:
        cmd: oc get storageclass -o json
      register: storage_classes
      changed_when: false

    - name: Check API health
      ansible.builtin.command:
        cmd: oc get --raw=/readyz
      register: api_health
      changed_when: false

    - name: Validate ClusterVersion
      ansible.builtin.assert:
        that:
          - >
            (cluster_version.stdout | from_json).status.conditions
            | selectattr('type', 'equalto', 'Available')
            | map(attribute='status')
            | first == 'True'
          - >
            (cluster_version.stdout | from_json).status.conditions
            | selectattr('type', 'equalto', 'Progressing')
            | map(attribute='status')
            | first == 'False'
          - >
            (cluster_version.stdout | from_json).status.conditions
            | selectattr('type', 'equalto', 'Failing')
            | map(attribute='status')
            | first == 'False'
        fail_msg: "ClusterVersion validation FAILED."
        success_msg: "ClusterVersion validation PASSED."

    - name: Validate ClusterOperators
      ansible.builtin.assert:
        that:
          - >
            item.status.conditions
            | selectattr('type', 'equalto', 'Available')
            | map(attribute='status')
            | first == 'True'
          - >
            item.status.conditions
            | selectattr('type', 'equalto', 'Progressing')
            | map(attribute='status')
            | first == 'False'
          - >
            item.status.conditions
            | selectattr('type', 'equalto', 'Degraded')
            | map(attribute='status')
            | first == 'False'
        fail_msg: "ClusterOperator {{ item.metadata.name }} validation FAILED."
        success_msg: "ClusterOperator {{ item.metadata.name }} validation PASSED."
      loop: "{{ (cluster_operators.stdout | from_json)['items'] }}"
      loop_control:
        label: "{{ item.metadata.name }}"

    - name: Validate MachineConfigPools
      ansible.builtin.assert:
        that:
          - >
            item.status.conditions
            | selectattr('type', 'equalto', 'Updated')
            | map(attribute='status')
            | first == 'True'
          - >
            item.status.conditions
            | selectattr('type', 'equalto', 'Updating')
            | map(attribute='status')
            | first == 'False'
          - >
            item.status.conditions
            | selectattr('type', 'equalto', 'Degraded')
            | map(attribute='status')
            | first == 'False'
        fail_msg: "MachineConfigPool {{ item.metadata.name }} validation FAILED."
        success_msg: "MachineConfigPool {{ item.metadata.name }} validation PASSED."
      loop: "{{ (machine_config_pools.stdout | from_json)['items'] }}"
      loop_control:
        label: "{{ item.metadata.name }}"

    - name: Validate Nodes
      ansible.builtin.assert:
        that:
          - >
            item.status.conditions
            | selectattr('type', 'equalto', 'Ready')
            | map(attribute='status')
            | first == 'True'
        fail_msg: "Node {{ item.metadata.name }} is NOT Ready."
        success_msg: "Node {{ item.metadata.name }} is Ready."
      loop: "{{ (cluster_nodes.stdout | from_json)['items'] }}"
      loop_control:
        label: "{{ item.metadata.name }}"

    - name: Find pending CSRs
      ansible.builtin.set_fact:
        pending_csrs: >-
          {{
            (csrs.stdout | from_json)['items']
            | selectattr('status.certificate', 'undefined')
            | list
          }}

    - name: Validate CSRs
      ansible.builtin.assert:
        that:
          - pending_csrs | length == 0
        fail_msg: "CSR validation FAILED. Pending CSR(s) found."
        success_msg: "CSR validation PASSED."

    - name: Find unhealthy Pods
      ansible.builtin.set_fact:
        unhealthy_pods: >-
          {{
            (all_pods.stdout | from_json)['items']
            | selectattr('status.phase', 'defined')
            | rejectattr('status.phase', 'equalto', 'Running')
            | rejectattr('status.phase', 'equalto', 'Succeeded')
            | rejectattr('status.phase', 'equalto', 'Completed')
            | list
          }}

    - name: Validate Pods
      ansible.builtin.assert:
        that:
          - unhealthy_pods | length == 0
        fail_msg: "Pod validation FAILED. Unhealthy pod(s) found."
        success_msg: "Pod validation PASSED."

    - name: Validate API health
      ansible.builtin.assert:
        that:
          - api_health.rc == 0
          - "'ok' in api_health.stdout"
        fail_msg: "API health validation FAILED."
        success_msg: "API health validation PASSED."

    - name: Validate Authentication
      ansible.builtin.assert:
        that:
          - >
            ((authentication.stdout | from_json).status.conditions
            | selectattr('type', 'equalto', 'Available')
            | map(attribute='status')
            | first) == 'True'
          - >
            ((authentication.stdout | from_json).status.conditions
            | selectattr('type', 'equalto', 'Degraded')
            | map(attribute='status')
            | first) == 'False'
        fail_msg: "Authentication validation FAILED."
        success_msg: "Authentication validation PASSED."

    - name: Validate Console
      ansible.builtin.assert:
        that:
          - >
            ((console.stdout | from_json).status.conditions
            | selectattr('type', 'equalto', 'Available')
            | map(attribute='status')
            | first) == 'True'
          - >
            ((console.stdout | from_json).status.conditions
            | selectattr('type', 'equalto', 'Degraded')
            | map(attribute='status')
            | first) == 'False'
        fail_msg: "Console validation FAILED."
        success_msg: "Console validation PASSED."

    - name: Validate DNS
      ansible.builtin.assert:
        that:
          - >
            ((dns.stdout | from_json).status.clusterDomain | default(''))
            | length > 0
        fail_msg: "DNS validation FAILED."
        success_msg: "DNS validation PASSED."

    - name: Validate Network
      ansible.builtin.assert:
        that:
          - >
            ((network.stdout | from_json).status.clusterNetwork | default([]))
            | length > 0
        fail_msg: "Network validation FAILED."
        success_msg: "Network validation PASSED."

    - name: Validate Ingress
      ansible.builtin.assert:
        that:
          - >
            (ingress.stdout | from_json)['items'] | length > 0
        fail_msg: "Ingress validation FAILED."
        success_msg: "Ingress validation PASSED."

    - name: Validate StorageClasses
      ansible.builtin.assert:
        that:
          - >
            (storage_classes.stdout | from_json)['items'] | length > 0
        fail_msg: "StorageClass validation FAILED."
        success_msg: "StorageClass validation PASSED."

    - name: Create validation log
      ansible.builtin.copy:
        dest: "{{ validation_log }}"
        mode: "0644"
        content: |
          ============================================================
                    OPENSHIFT POST-UPGRADE VALIDATION
          ============================================================

          Cluster Version:
          {{ (cluster_version.stdout | from_json).status.desired.version }}

          ClusterVersion: PASSED
          ClusterOperators: PASSED
          MachineConfigPools: PASSED
          Nodes: PASSED
          CSRs: PASSED
          Pods: PASSED
          API Health: PASSED
          Authentication: PASSED
          Console: PASSED
          DNS: PASSED
          Network: PASSED
          Ingress: PASSED
          Storage: PASSED

          ============================================================
                    CLUSTER OPERATORS
          ============================================================

          {{ operators_summary.stdout }}

          ============================================================
                    MACHINECONFIGPOOLS
          ============================================================

          {{ mcp_summary.stdout }}

          ============================================================
                    NODES
          ============================================================

          {{ nodes_summary.stdout }}

          ============================================================
                    POST-UPGRADE VALIDATION PASSED
          ============================================================

    - name: Display validation summary
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "          OPENSHIFT POST-UPGRADE VALIDATION"
          - "============================================================"
          - "Cluster Version: {{ (cluster_version.stdout | from_json).status.desired.version }}"
          - "ClusterVersion: PASSED"
          - "ClusterOperators: PASSED"
          - "MachineConfigPools: PASSED"
          - "Nodes: PASSED"
          - "CSRs: PASSED"
          - "Pods: PASSED"
          - "API Health: PASSED"
          - "Authentication: PASSED"
          - "Console: PASSED"
          - "DNS: PASSED"
          - "Network: PASSED"
          - "Ingress: PASSED"
          - "Storage: PASSED"
          - "Log: {{ validation_log }}"
          - "============================================================"
          - "             POST-UPGRADE VALIDATION PASSED"
          - "============================================================"

- name: Save Post-Upgrade Validation Log on Bastion
  hosts: bastion
  gather_facts: false
  become: true

  vars:
    bastion_log: /tmp/openshift-post-upgrade-validation.log

  tasks:

    - name: Create validation log directory
      ansible.builtin.file:
        path: /tmp/openshift-post-upgrade-validation
        state: directory
        mode: "0755"

    - name: Copy validation log to bastion
      ansible.builtin.copy:
        src: /tmp/openshift-post-upgrade-validation.log
        dest: "{{ bastion_log }}"
        mode: "0644"

    - name: Verify validation log
      ansible.builtin.stat:
        path: "{{ bastion_log }}"
      register: validation_log

    - name: Display log location
      ansible.builtin.debug:
        msg: >-
          Post-upgrade validation log saved:
          {{ bastion_log }}
          ({{ validation_log.stat.size }} bytes)
