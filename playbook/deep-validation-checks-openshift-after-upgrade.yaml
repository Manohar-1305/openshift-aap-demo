---
- name: OpenShift Post-Upgrade Validation
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    bastion_log: "/tmp/openshift-post-upgrade-validation-{{ ansible_date_time.date }}_{{ ansible_date_time.time | replace(':', '-') }}.log"

  tasks:

    - name: Initialize validation log on bastion
      ansible.builtin.shell:
        cmd: |
          ssh root@bastion.ocp.manohar.in "cat > '{{ bastion_log }}' <<'EOF'
          ============================================================
                  OPENSHIFT POST-UPGRADE VALIDATION
          ============================================================
          EOF"
      no_log: true

    - name: Log validation start
      ansible.builtin.shell:
        cmd: |
          ssh root@bastion.ocp.manohar.in "echo '[\$(date '+%Y-%m-%d %H:%M:%S')] VALIDATION STARTED' >> '{{ bastion_log }}'"
      no_log: true

    - name: Login to OpenShift
      ansible.builtin.command:
        cmd: >
          oc login
          --server={{ lookup('env', 'K8S_AUTH_HOST') }}
          --token={{ lookup('env', 'K8S_AUTH_API_KEY') }}
          --insecure-skip-tls-verify=true
      changed_when: false
      no_log: true

    - name: Log OpenShift authentication
      ansible.builtin.shell:
        cmd: |
          ssh root@bastion.ocp.manohar.in "echo '[\$(date '+%Y-%m-%d %H:%M:%S')] OpenShift authentication: PASSED' >> '{{ bastion_log }}'"
      no_log: true

    - name: Get ClusterVersion
      ansible.builtin.command:
        cmd: oc get clusterversion version -o json
      register: cluster_version
      changed_when: false

    - name: Log ClusterVersion
      ansible.builtin.shell:
        cmd: |
          {
            echo ""
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] CLUSTERVERSION"
            echo "----------------------------------------"
            oc get clusterversion
          } | ssh root@bastion.ocp.manohar.in "cat >> '{{ bastion_log }}'"
      no_log: true

    - name: Get ClusterOperators
      ansible.builtin.command:
        cmd: oc get clusteroperators -o json
      register: cluster_operators
      changed_when: false

    - name: Log ClusterOperators
      ansible.builtin.shell:
        cmd: |
          {
            echo ""
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] CLUSTEROPERATORS"
            echo "----------------------------------------"
            oc get clusteroperators
          } | ssh root@bastion.ocp.manohar.in "cat >> '{{ bastion_log }}'"
      no_log: true

    - name: Get MachineConfigPools
      ansible.builtin.command:
        cmd: oc get machineconfigpools -o json
      register: machine_config_pools
      changed_when: false

    - name: Log MachineConfigPools
      ansible.builtin.shell:
        cmd: |
          {
            echo ""
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] MACHINECONFIGPOOLS"
            echo "----------------------------------------"
            oc get mcp
          } | ssh root@bastion.ocp.manohar.in "cat >> '{{ bastion_log }}'"
      no_log: true

    - name: Get Nodes
      ansible.builtin.command:
        cmd: oc get nodes -o json
      register: cluster_nodes
      changed_when: false

    - name: Log Nodes
      ansible.builtin.shell:
        cmd: |
          {
            echo ""
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] NODES"
            echo "----------------------------------------"
            oc get nodes
          } | ssh root@bastion.ocp.manohar.in "cat >> '{{ bastion_log }}'"
      no_log: true

    - name: Get CSRs
      ansible.builtin.command:
        cmd: oc get csr -o json
      register: csrs
      changed_when: false

    - name: Log CSRs
      ansible.builtin.shell:
        cmd: |
          {
            echo ""
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] CSRs"
            echo "----------------------------------------"
            oc get csr
          } | ssh root@bastion.ocp.manohar.in "cat >> '{{ bastion_log }}'"
      no_log: true

    - name: Get all Pods
      ansible.builtin.command:
        cmd: oc get pods -A -o json
      register: all_pods
      changed_when: false

    - name: Log Pods
      ansible.builtin.shell:
        cmd: |
          {
            echo ""
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] PODS"
            echo "----------------------------------------"
            oc get pods -A
          } | ssh root@bastion.ocp.manohar.in "cat >> '{{ bastion_log }}'"
      no_log: true

    - name: Get Infrastructure
      ansible.builtin.command:
        cmd: oc get infrastructure cluster -o json
      register: infrastructure
      changed_when: false

    - name: Log Infrastructure
      ansible.builtin.shell:
        cmd: |
          {
            echo ""
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] INFRASTRUCTURE"
            echo "----------------------------------------"
            oc get infrastructure cluster
          } | ssh root@bastion.ocp.manohar.in "cat >> '{{ bastion_log }}'"
      no_log: true

    - name: Get DNS
      ansible.builtin.command:
        cmd: oc get dns cluster -o json
      register: dns
      changed_when: false

    - name: Log DNS
      ansible.builtin.shell:
        cmd: |
          {
            echo ""
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] DNS"
            echo "----------------------------------------"
            oc get dns cluster
          } | ssh root@bastion.ocp.manohar.in "cat >> '{{ bastion_log }}'"
      no_log: true

    - name: Get Network
      ansible.builtin.command:
        cmd: oc get network cluster -o json
      register: network
      changed_when: false

    - name: Log Network
      ansible.builtin.shell:
        cmd: |
          {
            echo ""
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] NETWORK"
            echo "----------------------------------------"
            oc get network cluster
          } | ssh root@bastion.ocp.manohar.in "cat >> '{{ bastion_log }}'"
      no_log: true

    - name: Get Ingress
      ansible.builtin.command:
        cmd: oc get ingresscontroller -n openshift-ingress-operator -o json
      register: ingress
      changed_when: false

    - name: Log Ingress
      ansible.builtin.shell:
        cmd: |
          {
            echo ""
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] INGRESS"
            echo "----------------------------------------"
            oc get ingresscontroller -n openshift-ingress-operator
          } | ssh root@bastion.ocp.manohar.in "cat >> '{{ bastion_log }}'"
      no_log: true

    - name: Get Authentication
      ansible.builtin.command:
        cmd: oc get clusteroperator authentication -o json
      register: authentication
      changed_when: false

    - name: Get Console
      ansible.builtin.command:
        cmd: oc get clusteroperator console -o json
      register: console
      changed_when: false

    - name: Get StorageClasses
      ansible.builtin.command:
        cmd: oc get storageclass -o json
      register: storage_classes
      changed_when: false

    - name: Check API health
      ansible.builtin.command:
        cmd: oc get --raw=/readyz
      register: api_health
      changed_when: false

    - name: Log API health
      ansible.builtin.shell:
        cmd: |
          {
            echo ""
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] API HEALTH"
            echo "----------------------------------------"
            oc get --raw=/readyz
          } | ssh root@bastion.ocp.manohar.in "cat >> '{{ bastion_log }}'"
      no_log: true

    - name: Validate ClusterVersion
      block:

        - name: Validate ClusterVersion
          ansible.builtin.assert:
            that:
              - >
                (cluster_version.stdout | from_json).status.conditions
                | selectattr('type', 'equalto', 'Available')
                | map(attribute='status')
                | first == 'True'
              - >
                (cluster_version.stdout | from_json).status.conditions
                | selectattr('type', 'equalto', 'Progressing')
                | map(attribute='status')
                | first == 'False'
              - >
                (cluster_version.stdout | from_json).status.conditions
                | selectattr('type', 'equalto', 'Failing')
                | map(attribute='status')
                | first == 'False'

        - name: Log ClusterVersion result
          ansible.builtin.shell:
            cmd: |
              ssh root@bastion.ocp.manohar.in "echo '[\$(date '+%Y-%m-%d %H:%M:%S')] ClusterVersion validation: PASSED' >> '{{ bastion_log }}'"
          no_log: true

      rescue:

        - name: Log ClusterVersion failure
          ansible.builtin.shell:
            cmd: |
              ssh root@bastion.ocp.manohar.in "echo '[\$(date '+%Y-%m-%d %H:%M:%S')] ClusterVersion validation: FAILED' >> '{{ bastion_log }}'"
          no_log: true

        - name: Fail ClusterVersion validation
          ansible.builtin.fail:
            msg: "ClusterVersion validation FAILED."

    - name: Validate ClusterOperators
      block:

        - name: Validate ClusterOperators
          ansible.builtin.assert:
            that:
              - >
                item.status.conditions
                | selectattr('type', 'equalto', 'Available')
                | map(attribute='status')
                | first == 'True'
              - >
                item.status.conditions
                | selectattr('type', 'equalto', 'Progressing')
                | map(attribute='status')
                | first == 'False'
              - >
                item.status.conditions
                | selectattr('type', 'equalto', 'Degraded')
                | map(attribute='status')
                | first == 'False'
            fail_msg: "ClusterOperator {{ item.metadata.name }} validation FAILED."
          loop: "{{ (cluster_operators.stdout | from_json)['items'] }}"
          loop_control:
            label: "{{ item.metadata.name }}"

        - name: Log ClusterOperators result
          ansible.builtin.shell:
            cmd: |
              ssh root@bastion.ocp.manohar.in "echo '[\$(date '+%Y-%m-%d %H:%M:%S')] ClusterOperators validation: PASSED' >> '{{ bastion_log }}'"
          no_log: true

      rescue:

        - name: Log ClusterOperators failure
          ansible.builtin.shell:
            cmd: |
              ssh root@bastion.ocp.manohar.in "echo '[\$(date '+%Y-%m-%d %H:%M:%S')] ClusterOperators validation: FAILED' >> '{{ bastion_log }}'"
          no_log: true

        - name: Fail ClusterOperators validation
          ansible.builtin.fail:
            msg: "ClusterOperators validation FAILED."

    - name: Validate MachineConfigPools
      block:

        - name: Validate MachineConfigPools
          ansible.builtin.assert:
            that:
              - >
                item.status.conditions
                | selectattr('type', 'equalto', 'Updated')
                | map(attribute='status')
                | first == 'True'
              - >
                item.status.conditions
                | selectattr('type', 'equalto', 'Updating')
                | map(attribute='status')
                | first == 'False'
              - >
                item.status.conditions
                | selectattr('type', 'equalto', 'Degraded')
                | map(attribute='status')
                | first == 'False'
            fail_msg: "MachineConfigPool {{ item.metadata.name }} validation FAILED."
          loop: "{{ (machine_config_pools.stdout | from_json)['items'] }}"
          loop_control:
            label: "{{ item.metadata.name }}"

        - name: Log MCP result
          ansible.builtin.shell:
            cmd: |
              ssh root@bastion.ocp.manohar.in "echo '[\$(date '+%Y-%m-%d %H:%M:%S')] MachineConfigPools validation: PASSED' >> '{{ bastion_log }}'"
          no_log: true

      rescue:

        - name: Log MCP failure
          ansible.builtin.shell:
            cmd: |
              ssh root@bastion.ocp.manohar.in "echo '[\$(date '+%Y-%m-%d %H:%M:%S')] MachineConfigPools validation: FAILED' >> '{{ bastion_log }}'"
          no_log: true

        - name: Fail MCP validation
          ansible.builtin.fail:
            msg: "MachineConfigPool validation FAILED."

    - name: Validate Nodes
      block:

        - name: Validate Nodes
          ansible.builtin.assert:
            that:
              - >
                item.status.conditions
                | selectattr('type', 'equalto', 'Ready')
                | map(attribute='status')
                | first == 'True'
            fail_msg: "Node {{ item.metadata.name }} is NOT Ready."
          loop: "{{ (cluster_nodes.stdout | from_json)['items'] }}"
          loop_control:
            label: "{{ item.metadata.name }}"

        - name: Log Nodes result
          ansible.builtin.shell:
            cmd: |
              ssh root@bastion.ocp.manohar.in "echo '[\$(date '+%Y-%m-%d %H:%M:%S')] Node validation: PASSED' >> '{{ bastion_log }}'"
          no_log: true

      rescue:

        - name: Log Nodes failure
          ansible.builtin.shell:
            cmd: |
              ssh root@bastion.ocp.manohar.in "echo '[\$(date '+%Y-%m-%d %H:%M:%S')] Node validation: FAILED' >> '{{ bastion_log }}'"
          no_log: true

        - name: Fail Node validation
          ansible.builtin.fail:
            msg: "Node validation FAILED."

    - name: Find pending CSRs
      ansible.builtin.set_fact:
        pending_csrs: >-
          {{
            (csrs.stdout | from_json)['items']
            | selectattr('status.certificate', 'undefined')
            | list
          }}

    - name: Validate CSRs
      block:

        - name: Validate CSRs
          ansible.builtin.assert:
            that:
              - pending_csrs | length == 0
            fail_msg: "CSR validation FAILED. Pending CSR(s) found."

        - name: Log CSR result
          ansible.builtin.shell:
            cmd: |
              ssh root@bastion.ocp.manohar.in "echo '[\$(date '+%Y-%m-%d %H:%M:%S')] CSR validation: PASSED' >> '{{ bastion_log }}'"
          no_log: true

      rescue:

        - name: Log CSR failure
          ansible.builtin.shell:
            cmd: |
              {
                echo "[$(date '+%Y-%m-%d %H:%M:%S')] CSR validation: FAILED"
                echo "Pending CSR count: {{ pending_csrs | length }}"
                oc get csr
              } | ssh root@bastion.ocp.manohar.in "cat >> '{{ bastion_log }}'"
          no_log: true

        - name: Fail CSR validation
          ansible.builtin.fail:
            msg: "CSR validation FAILED."

    - name: Find unhealthy Pods
      ansible.builtin.set_fact:
        unhealthy_pods: >-
          {{
            (all_pods.stdout | from_json)['items']
            | selectattr('status.phase', 'defined')
            | rejectattr('status.phase', 'equalto', 'Running')
            | rejectattr('status.phase', 'equalto', 'Succeeded')
            | rejectattr('status.phase', 'equalto', 'Completed')
            | list
          }}

    - name: Log Pod validation details
      ansible.builtin.shell:
        cmd: |
          {
            echo ""
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] POD VALIDATION"
            echo "----------------------------------------"
            echo "Unhealthy pod count: {{ unhealthy_pods | length }}"
            {% for pod in unhealthy_pods %}
            echo "Namespace: {{ pod.metadata.namespace }} | Pod: {{ pod.metadata.name }} | Phase: {{ pod.status.phase }}"
            {% endfor %}
          } | ssh root@bastion.ocp.manohar.in "cat >> '{{ bastion_log }}'"
      no_log: true

    - name: Validate Pods
      block:

        - name: Validate Pods
          ansible.builtin.assert:
            that:
              - unhealthy_pods | length == 0
            fail_msg: "Pod validation FAILED. Unhealthy pod(s) found."

        - name: Log Pod result
          ansible.builtin.shell:
            cmd: |
              ssh root@bastion.ocp.manohar.in "echo '[\$(date '+%Y-%m-%d %H:%M:%S')] Pod validation: PASSED' >> '{{ bastion_log }}'"
          no_log: true

      rescue:

        - name: Log Pod failure
          ansible.builtin.shell:
            cmd: |
              ssh root@bastion.ocp.manohar.in "echo '[\$(date '+%Y-%m-%d %H:%M:%S')] Pod validation: FAILED' >> '{{ bastion_log }}'"
          no_log: true

        - name: Fail Pod validation
          ansible.builtin.fail:
            msg: "Pod validation FAILED. Unhealthy pod(s) found."

    - name: Validate API Health
      block:

        - name: Validate API Health
          ansible.builtin.assert:
            that:
              - api_health.rc == 0
              - "'ok' in api_health.stdout"

        - name: Log API result
          ansible.builtin.shell:
            cmd: |
              ssh root@bastion.ocp.manohar.in "echo '[\$(date '+%Y-%m-%d %H:%M:%S')] API health validation: PASSED' >> '{{ bastion_log }}'"
          no_log: true

      rescue:

        - name: Log API failure
          ansible.builtin.shell:
            cmd: |
              ssh root@bastion.ocp.manohar.in "echo '[\$(date '+%Y-%m-%d %H:%M:%S')] API health validation: FAILED' >> '{{ bastion_log }}'"
          no_log: true

        - name: Fail API validation
          ansible.builtin.fail:
            msg: "API health validation FAILED."

    - name: Validate Authentication
      block:

        - name: Validate Authentication
          ansible.builtin.assert:
            that:
              - >
                ((authentication.stdout | from_json).status.conditions
                | selectattr('type', 'equalto', 'Available')
                | map(attribute='status')
                | first) == 'True'
              - >
                ((authentication.stdout | from_json).status.conditions
                | selectattr('type', 'equalto', 'Degraded')
                | map(attribute='status')
                | first) == 'False'

        - name: Log Authentication result
          ansible.builtin.shell:
            cmd: |
              ssh root@bastion.ocp.manohar.in "echo '[\$(date '+%Y-%m-%d %H:%M:%S')] Authentication validation: PASSED' >> '{{ bastion_log }}'"
          no_log: true

      rescue:

        - name: Log Authentication failure
          ansible.builtin.shell:
            cmd: |
              ssh root@bastion.ocp.manohar.in "echo '[\$(date '+%Y-%m-%d %H:%M:%S')] Authentication validation: FAILED' >> '{{ bastion_log }}'"
          no_log: true

        - name: Fail Authentication validation
          ansible.builtin.fail:
            msg: "Authentication validation FAILED."

    - name: Validate Console
      block:

        - name: Validate Console
          ansible.builtin.assert:
            that:
              - >
                ((console.stdout | from_json).status.conditions
                | selectattr('type', 'equalto', 'Available')
                | map(attribute='status')
                | first) == 'True'
              - >
                ((console.stdout | from_json).status.conditions
                | selectattr('type', 'equalto', 'Degraded')
                | map(attribute='status')
                | first) == 'False'

        - name: Log Console result
          ansible.builtin.shell:
            cmd: |
              ssh root@bastion.ocp.manohar.in "echo '[\$(date '+%Y-%m-%d %H:%M:%S')] Console validation: PASSED' >> '{{ bastion_log }}'"
          no_log: true

      rescue:

        - name: Log Console failure
          ansible.builtin.shell:
            cmd: |
              ssh root@bastion.ocp.manohar.in "echo '[\$(date '+%Y-%m-%d %H:%M:%S')] Console validation: FAILED' >> '{{ bastion_log }}'"
          no_log: true

        - name: Fail Console validation
          ansible.builtin.fail:
            msg: "Console validation FAILED."

    - name: Validate DNS
      block:

        - name: Validate DNS
          ansible.builtin.assert:
            that:
              - >
                ((dns.stdout | from_json).status.clusterDomain | default(''))
                | length > 0

        - name: Log DNS result
          ansible.builtin.shell:
            cmd: |
              ssh root@bastion.ocp.manohar.in "echo '[\$(date '+%Y-%m-%d %H:%M:%S')] DNS validation: PASSED' >> '{{ bastion_log }}'"
          no_log: true

      rescue:

        - name: Log DNS failure
          ansible.builtin.shell:
            cmd: |
              ssh root@bastion.ocp.manohar.in "echo '[\$(date '+%Y-%m-%d %H:%M:%S')] DNS validation: FAILED' >> '{{ bastion_log }}'"
          no_log: true

        - name: Fail DNS validation
          ansible.builtin.fail:
            msg: "DNS validation FAILED."

    - name: Validate Network
      block:

        - name: Validate Network
          ansible.builtin.assert:
            that:
              - >
                ((network.stdout | from_json).status.clusterNetwork | default([]))
                | length > 0

        - name: Log Network result
          ansible.builtin.shell:
            cmd: |
              ssh root@bastion.ocp.manohar.in "echo '[\$(date '+%Y-%m-%d %H:%M:%S')] Network validation: PASSED' >> '{{ bastion_log }}'"
          no_log: true

      rescue:

        - name: Log Network failure
          ansible.builtin.shell:
            cmd: |
              ssh root@bastion.ocp.manohar.in "echo '[\$(date '+%Y-%m-%d %H:%M:%S')] Network validation: FAILED' >> '{{ bastion_log }}'"
          no_log: true

        - name: Fail Network validation
          ansible.builtin.fail:
            msg: "Network validation FAILED."

    - name: Validate Ingress
      block:

        - name: Validate Ingress
          ansible.builtin.assert:
            that:
              - >
                (ingress.stdout | from_json)['items'] | length > 0

        - name: Log Ingress result
          ansible.builtin.shell:
            cmd: |
              ssh root@bastion.ocp.manohar.in "echo '[\$(date '+%Y-%m-%d %H:%M:%S')] Ingress validation: PASSED' >> '{{ bastion_log }}'"
          no_log: true

      rescue:

        - name: Log Ingress failure
          ansible.builtin.shell:
            cmd: |
              ssh root@bastion.ocp.manohar.in "echo '[\$(date '+%Y-%m-%d %H:%M:%S')] Ingress validation: FAILED' >> '{{ bastion_log }}'"
          no_log: true

        - name: Fail Ingress validation
          ansible.builtin.fail:
            msg: "Ingress validation FAILED."

    - name: Validate StorageClasses
      block:

        - name: Validate StorageClasses
          ansible.builtin.assert:
            that:
              - >
                (storage_classes.stdout | from_json)['items'] | length > 0

        - name: Log Storage result
          ansible.builtin.shell:
            cmd: |
              ssh root@bastion.ocp.manohar.in "echo '[\$(date '+%Y-%m-%d %H:%M:%S')] Storage validation: PASSED' >> '{{ bastion_log }}'"
          no_log: true

      rescue:

        - name: Log Storage failure
          ansible.builtin.shell:
            cmd: |
              ssh root@bastion.ocp.manohar.in "echo '[\$(date '+%Y-%m-%d %H:%M:%S')] Storage validation: FAILED' >> '{{ bastion_log }}'"
          no_log: true

        - name: Fail Storage validation
          ansible.builtin.fail:
            msg: "Storage validation FAILED."

    - name: Log successful completion
      ansible.builtin.shell:
        cmd: |
          {
            echo ""
            echo "============================================================"
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] POST-UPGRADE VALIDATION PASSED"
            echo "============================================================"
          } | ssh root@bastion.ocp.manohar.in "cat >> '{{ bastion_log }}'"
      no_log: true
