---
- name: Initialize OpenShift Post-Upgrade Validation Log
  hosts: bastion
  gather_facts: true
  become: true

  tasks:

    - name: Set validation log path
      ansible.builtin.set_fact:
        validation_log: "/tmp/openshift-post-upgrade-validation-{{ ansible_date_time.date }}_{{ ansible_date_time.time | replace(':', '-') }}.log"

    - name: Create validation log
      ansible.builtin.copy:
        dest: "{{ validation_log }}"
        mode: "0644"
        content: |
          ============================================================
                  OPENSHIFT POST-UPGRADE VALIDATION
          ============================================================
          Start Date      : {{ ansible_date_time.date }}
          Start Time      : {{ ansible_date_time.time }}
          Start Timestamp : {{ ansible_date_time.iso8601 }}
          ============================================================
          VALIDATION STARTED
          ============================================================

    - name: Display log location
      ansible.builtin.debug:
        msg: "Validation log: {{ validation_log }}"


- name: OpenShift Post-Upgrade Validation
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    validation_log: "{{ hostvars['bastion']['validation_log'] }}"

  tasks:

    - name: Login to OpenShift
      ansible.builtin.command:
        cmd: >
          oc login
          --server={{ lookup('env', 'K8S_AUTH_HOST') }}
          --token={{ lookup('env', 'K8S_AUTH_API_KEY') }}
          --insecure-skip-tls-verify=true
      register: oc_login
      changed_when: false
      no_log: true

    - name: Log authentication result
      ansible.builtin.shell:
        cmd: |
          echo "[$(date '+%Y-%m-%d %H:%M:%S')] OpenShift authentication: PASSED" >> "{{ validation_log }}"
      delegate_to: bastion

    - name: Get ClusterVersion
      ansible.builtin.command:
        cmd: oc get clusterversion version -o json
      register: cluster_version
      changed_when: false

    - name: Log ClusterVersion
      ansible.builtin.shell:
        cmd: |
          {
            echo ""
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] CLUSTERVERSION"
            echo "----------------------------------------"
            oc get clusterversion version
          } >> "{{ validation_log }}"
      delegate_to: bastion

    - name: Validate ClusterVersion
      ansible.builtin.assert:
        that:
          - >
            (cluster_version.stdout | from_json).status.conditions
            | selectattr('type', 'equalto', 'Available')
            | map(attribute='status')
            | first == 'True'
          - >
            (cluster_version.stdout | from_json).status.conditions
            | selectattr('type', 'equalto', 'Progressing')
            | map(attribute='status')
            | first == 'False'
          - >
            (cluster_version.stdout | from_json).status.conditions
            | selectattr('type', 'equalto', 'Failing')
            | map(attribute='status')
            | first == 'False'
        fail_msg: "ClusterVersion validation FAILED."

    - name: Log ClusterVersion validation
      ansible.builtin.shell:
        cmd: |
          echo "[$(date '+%Y-%m-%d %H:%M:%S')] ClusterVersion validation: PASSED" >> "{{ validation_log }}"
      delegate_to: bastion

    - name: Get ClusterOperators
      ansible.builtin.command:
        cmd: oc get clusteroperators -o json
      register: cluster_operators
      changed_when: false

    - name: Log ClusterOperators
      ansible.builtin.shell:
        cmd: |
          {
            echo ""
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] CLUSTEROPERATORS"
            echo "----------------------------------------"
            oc get clusteroperators
          } >> "{{ validation_log }}"
      delegate_to: bastion

    - name: Validate ClusterOperators
      ansible.builtin.assert:
        that:
          - >
            item.status.conditions
            | selectattr('type', 'equalto', 'Available')
            | map(attribute='status')
            | first == 'True'
          - >
            item.status.conditions
            | selectattr('type', 'equalto', 'Progressing')
            | map(attribute='status')
            | first == 'False'
          - >
            item.status.conditions
            | selectattr('type', 'equalto', 'Degraded')
            | map(attribute='status')
            | first == 'False'
        fail_msg: "ClusterOperator {{ item.metadata.name }} validation FAILED."
      loop: "{{ (cluster_operators.stdout | from_json)['items'] }}"
      loop_control:
        label: "{{ item.metadata.name }}"

    - name: Log ClusterOperators validation
      ansible.builtin.shell:
        cmd: |
          echo "[$(date '+%Y-%m-%d %H:%M:%S')] ClusterOperators validation: PASSED" >> "{{ validation_log }}"
      delegate_to: bastion

    - name: Get MachineConfigPools
      ansible.builtin.command:
        cmd: oc get mcp -o json
      register: machine_config_pools
      changed_when: false

    - name: Log MachineConfigPools
      ansible.builtin.shell:
        cmd: |
          {
            echo ""
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] MACHINECONFIGPOOLS"
            echo "----------------------------------------"
            oc get mcp
          } >> "{{ validation_log }}"
      delegate_to: bastion

    - name: Validate MachineConfigPools
      ansible.builtin.assert:
        that:
          - >
            item.status.conditions
            | selectattr('type', 'equalto', 'Updated')
            | map(attribute='status')
            | first == 'True'
          - >
            item.status.conditions
            | selectattr('type', 'equalto', 'Updating')
            | map(attribute='status')
            | first == 'False'
          - >
            item.status.conditions
            | selectattr('type', 'equalto', 'Degraded')
            | map(attribute='status')
            | first == 'False'
        fail_msg: "MachineConfigPool {{ item.metadata.name }} validation FAILED."
      loop: "{{ (machine_config_pools.stdout | from_json)['items'] }}"
      loop_control:
        label: "{{ item.metadata.name }}"

    - name: Log MCP validation
      ansible.builtin.shell:
        cmd: |
          echo "[$(date '+%Y-%m-%d %H:%M:%S')] MachineConfigPools validation: PASSED" >> "{{ validation_log }}"
      delegate_to: bastion

    - name: Get Nodes
      ansible.builtin.command:
        cmd: oc get nodes -o json
      register: cluster_nodes
      changed_when: false

    - name: Log Nodes
      ansible.builtin.shell:
        cmd: |
          {
            echo ""
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] NODES"
            echo "----------------------------------------"
            oc get nodes -o wide
          } >> "{{ validation_log }}"
      delegate_to: bastion

    - name: Validate Nodes
      ansible.builtin.assert:
        that:
          - >
            item.status.conditions
            | selectattr('type', 'equalto', 'Ready')
            | map(attribute='status')
            | first == 'True'
        fail_msg: "Node {{ item.metadata.name }} is NOT Ready."
      loop: "{{ (cluster_nodes.stdout | from_json)['items'] }}"
      loop_control:
        label: "{{ item.metadata.name }}"

    - name: Log node validation
      ansible.builtin.shell:
        cmd: |
          echo "[$(date '+%Y-%m-%d %H:%M:%S')] Node validation: PASSED" >> "{{ validation_log }}"
      delegate_to: bastion

    - name: Get CSRs
      ansible.builtin.command:
        cmd: oc get csr -o json
      register: csrs
      changed_when: false

    - name: Find pending CSRs
      ansible.builtin.set_fact:
        pending_csrs: >-
          {{
            (csrs.stdout | from_json)['items']
            | selectattr('status.certificate', 'undefined')
            | list
          }}

    - name: Log CSRs
      ansible.builtin.shell:
        cmd: |
          {
            echo ""
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] CSRs"
            echo "----------------------------------------"
            oc get csr
          } >> "{{ validation_log }}"
      delegate_to: bastion

    - name: Validate CSRs
      ansible.builtin.assert:
        that:
          - pending_csrs | length == 0
        fail_msg: "CSR validation FAILED. Pending CSR(s) found."

    - name: Log CSR validation
      ansible.builtin.shell:
        cmd: |
          echo "[$(date '+%Y-%m-%d %H:%M:%S')] CSR validation: PASSED" >> "{{ validation_log }}"
      delegate_to: bastion

    - name: Get all Pods
      ansible.builtin.command:
        cmd: oc get pods -A -o json
      register: all_pods
      changed_when: false

    - name: Find unhealthy Pods
      ansible.builtin.set_fact:
        unhealthy_pods: >-
          {{
            (all_pods.stdout | from_json)['items']
            | selectattr('status.phase', 'defined')
            | selectattr('status.phase', 'in', ['Pending', 'Failed', 'Unknown'])
            | rejectattr('metadata.name', 'match', '^installer-')
            | list
          }}

    - name: Initialize unready container pod list
      ansible.builtin.set_fact:
        container_unhealthy_pods: []

    - name: Find Pods with unready containers
      ansible.builtin.set_fact:
        container_unhealthy_pods: >-
          {{
            container_unhealthy_pods
            + [item.metadata.namespace ~ '/' ~ item.metadata.name]
          }}
      loop: "{{ (all_pods.stdout | from_json)['items'] }}"
      loop_control:
        label: "{{ item.metadata.namespace }}/{{ item.metadata.name }}"
      when:
        - item.metadata.name is not match('^installer-')
        - item.status.phase == 'Running'
        - item.status.containerStatuses is defined
        - >
          (
            item.status.containerStatuses
            | selectattr('ready', 'equalto', false)
            | list
            | length
          ) > 0
        - >
          (
            item.status.containerStatuses
            | selectattr('state.waiting', 'defined')
            | selectattr('state.waiting.reason', 'in',
                ['CrashLoopBackOff', 'ImagePullBackOff', 'ErrImagePull',
                 'CreateContainerError', 'CreateContainerConfigError',
                 'RunContainerError'])
            | list
            | length
          ) > 0

    - name: Log Pods
      ansible.builtin.shell:
        cmd: |
          {
            echo ""
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] POD VALIDATION"
            echo "----------------------------------------"
            echo "Pending/Failed/Unknown pods: {{ unhealthy_pods | length }}"
            echo "Pods with actual container failures: {{ container_unhealthy_pods | length }}"
            oc get pods -A
          } >> "{{ validation_log }}"
      delegate_to: bastion

    - name: Validate Pods
      ansible.builtin.assert:
        that:
          - unhealthy_pods | length == 0
          - container_unhealthy_pods | length == 0
        fail_msg: >-
          Pod validation FAILED.
          Unhealthy pods: {{ unhealthy_pods | join(', ') if unhealthy_pods | length > 0 else 'None' }}.
          Pods with actual container failures:
          {{ container_unhealthy_pods | join(', ') if container_unhealthy_pods | length > 0 else 'None' }}.
        success_msg: "Pod validation PASSED. No current unhealthy pods detected."

    - name: Log Pod validation
      ansible.builtin.shell:
        cmd: |
          echo "[$(date '+%Y-%m-%d %H:%M:%S')] Pod validation: PASSED" >> "{{ validation_log }}"
      delegate_to: bastion

    - name: Get Infrastructure
      ansible.builtin.command:
        cmd: oc get infrastructure cluster
      register: infrastructure
      changed_when: false

    - name: Log Infrastructure
      ansible.builtin.shell:
        cmd: |
          {
            echo ""
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] INFRASTRUCTURE"
            echo "----------------------------------------"
            oc get infrastructure cluster
          } >> "{{ validation_log }}"
      delegate_to: bastion

    - name: Get DNS
      ansible.builtin.command:
        cmd: oc get dns cluster
      register: dns
      changed_when: false

    - name: Log DNS
      ansible.builtin.shell:
        cmd: |
          {
            echo ""
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] DNS"
            echo "----------------------------------------"
            oc get dns cluster
          } >> "{{ validation_log }}"
      delegate_to: bastion

    - name: Get Network
      ansible.builtin.command:
        cmd: oc get network cluster
      register: network
      changed_when: false

    - name: Log Network
      ansible.builtin.shell:
        cmd: |
          {
            echo ""
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] NETWORK"
            echo "----------------------------------------"
            oc get network cluster
          } >> "{{ validation_log }}"
      delegate_to: bastion

    - name: Get Ingress
      ansible.builtin.command:
        cmd: oc get ingresscontroller -n openshift-ingress-operator
      register: ingress
      changed_when: false

    - name: Log Ingress
      ansible.builtin.shell:
        cmd: |
          {
            echo ""
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] INGRESS"
            echo "----------------------------------------"
            oc get ingresscontroller -n openshift-ingress-operator
          } >> "{{ validation_log }}"
      delegate_to: bastion

    - name: Get Authentication
      ansible.builtin.command:
        cmd: oc get clusteroperator authentication
      register: authentication
      changed_when: false

    - name: Get Console
      ansible.builtin.command:
        cmd: oc get clusteroperator console
      register: console
      changed_when: false

    - name: Log Authentication and Console
      ansible.builtin.shell:
        cmd: |
          {
            echo ""
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] AUTHENTICATION"
            echo "----------------------------------------"
            oc get clusteroperator authentication
            echo ""
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] CONSOLE"
            echo "----------------------------------------"
            oc get clusteroperator console
          } >> "{{ validation_log }}"
      delegate_to: bastion

    - name: Get StorageClasses
      ansible.builtin.command:
        cmd: oc get storageclass
      register: storage_classes
      changed_when: false

    - name: Log StorageClasses
      ansible.builtin.shell:
        cmd: |
          {
            echo ""
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] STORAGECLASSES"
            echo "----------------------------------------"
            oc get storageclass
          } >> "{{ validation_log }}"
      delegate_to: bastion

    - name: Check API health
      ansible.builtin.command:
        cmd: oc get --raw=/readyz
      register: api_health
      changed_when: false

    - name: Log API health
      ansible.builtin.shell:
        cmd: |
          {
            echo ""
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] API HEALTH"
            echo "----------------------------------------"
            oc get --raw=/readyz
          } >> "{{ validation_log }}"
      delegate_to: bastion

    - name: Validate API health
      ansible.builtin.assert:
        that:
          - api_health.rc == 0
          - "'ok' in api_health.stdout"
        fail_msg: "API health validation FAILED."

    - name: Log API validation
      ansible.builtin.shell:
        cmd: |
          echo "[$(date '+%Y-%m-%d %H:%M:%S')] API health validation: PASSED" >> "{{ validation_log }}"
      delegate_to: bastion

    - name: Validate Authentication operator
      ansible.builtin.command:
        cmd: oc get clusteroperator authentication -o json
      register: authentication_json
      changed_when: false

    - name: Assert Authentication
      ansible.builtin.assert:
        that:
          - >
            (authentication_json.stdout | from_json).status.conditions
            | selectattr('type', 'equalto', 'Available')
            | map(attribute='status')
            | first == 'True'
          - >
            (authentication_json.stdout | from_json).status.conditions
            | selectattr('type', 'equalto', 'Degraded')
            | map(attribute='status')
            | first == 'False'
        fail_msg: "Authentication operator validation FAILED."

    - name: Log Authentication validation
      ansible.builtin.shell:
        cmd: |
          echo "[$(date '+%Y-%m-%d %H:%M:%S')] Authentication validation: PASSED" >> "{{ validation_log }}"
      delegate_to: bastion

    - name: Validate Console operator
      ansible.builtin.command:
        cmd: oc get clusteroperator console -o json
      register: console_json
      changed_when: false

    - name: Assert Console
      ansible.builtin.assert:
        that:
          - >
            (console_json.stdout | from_json).status.conditions
            | selectattr('type', 'equalto', 'Available')
            | map(attribute='status')
            | first == 'True'
          - >
            (console_json.stdout | from_json).status.conditions
            | selectattr('type', 'equalto', 'Degraded')
            | map(attribute='status')
            | first == 'False'
        fail_msg: "Console operator validation FAILED."

    - name: Log Console validation
      ansible.builtin.shell:
        cmd: |
          echo "[$(date '+%Y-%m-%d %H:%M:%S')] Console validation: PASSED" >> "{{ validation_log }}"
      delegate_to: bastion

    - name: Log validation completion
      ansible.builtin.shell:
        cmd: |
          {
            echo ""
            echo "============================================================"
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] POST-UPGRADE VALIDATION COMPLETED"
            echo "============================================================"
          } >> "{{ validation_log }}"
      delegate_to: bastion

    - name: Display validation log location
      ansible.builtin.debug:
        msg: "Post-upgrade validation log saved on Bastion: {{ validation_log }}"
