---
- name: OpenShift SNO Post-Upgrade Validation
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    log_dir: /tmp/ocp_health_checks
    validation_log: "{{ log_dir }}/openshift-post-upgrade-validation_{{ ansible_date_time.iso8601_basic_short }}.log"

  environment:
    KUBECONFIG: "{{ log_dir }}/kubeconfig_{{ ansible_date_time.iso8601_basic_short }}"

  tasks:

    - name: Ensure log directory exists
      ansible.builtin.file:
        path: "{{ log_dir }}"
        state: directory
        mode: "0755"

    - name: Initialize log file with header
      ansible.builtin.copy:
        dest: "{{ validation_log }}"
        mode: "0644"
        content: |
          ==============================================
             OPENSHIFT SNO POST-UPGRADE VALIDATION
             Run started: {{ ansible_date_time.iso8601 }}
          ==============================================

    - name: Verify K8S auth env vars are present
      ansible.builtin.fail:
        msg: >
          K8S_AUTH_HOST or K8S_AUTH_API_KEY is empty. Attach an
          OpenShift/Kubernetes API credential to this Job Template in AAP.
      when: >
        (lookup('env', 'K8S_AUTH_HOST') | length == 0) or
        (lookup('env', 'K8S_AUTH_API_KEY') | length == 0)

    - name: Login to OpenShift
      ansible.builtin.command:
        cmd: >
          oc login
          --server={{ lookup('env', 'K8S_AUTH_HOST') }}
          --token={{ lookup('env', 'K8S_AUTH_API_KEY') }}
          --insecure-skip-tls-verify=true
      register: login_result
      changed_when: false
      no_log: true

    - name: Verify login succeeded
      ansible.builtin.fail:
        msg: "oc login failed — check the credential's token validity and API server reachability."
      when: login_result.rc != 0

    - name: Get cluster version
      ansible.builtin.command:
        cmd: oc get clusterversion version -o json
      register: cluster_version
      changed_when: false

    - name: Get cluster operators
      ansible.builtin.command:
        cmd: oc get clusteroperators -o json
      register: cluster_operators
      changed_when: false

    - name: Get cluster nodes
      ansible.builtin.command:
        cmd: oc get nodes -o json
      register: cluster_nodes
      changed_when: false

    - name: Get MachineConfigPools
      ansible.builtin.command:
        cmd: oc get mcp -o json
      register: cluster_mcp
      changed_when: false

    - name: Get cluster operators summary
      ansible.builtin.command:
        cmd: oc get clusteroperators
      register: operators_summary
      changed_when: false

    - name: Get nodes summary
      ansible.builtin.command:
        cmd: oc get nodes
      register: nodes_summary
      changed_when: false

    - name: Get MCP summary
      ansible.builtin.command:
        cmd: oc get mcp
      register: mcp_summary
      changed_when: false

    - name: Get non-running pods cluster-wide
      ansible.builtin.shell:
        cmd: oc get pods -A | grep -v Running | grep -v Completed || true
      register: pods_summary
      changed_when: false

    - name: Get etcd pod name (SNO - single member)
      ansible.builtin.command:
        cmd: oc get pods -n openshift-etcd -l app=etcd -o jsonpath='{.items[0].metadata.name}'
      register: etcd_pod
      changed_when: false

    - name: Check etcd health (single member)
      ansible.builtin.shell:
        cmd: >
          oc rsh -n openshift-etcd {{ etcd_pod.stdout }}
          etcdctl endpoint health --cluster -w table
      register: etcd_health_summary
      changed_when: false
      failed_when: false

    - name: Get warning events
      ansible.builtin.shell:
        cmd: oc get events -A --field-selector type=Warning --sort-by='.lastTimestamp' || true
      register: events_summary
      changed_when: false

    - name: Get ingress, console, image-registry operator status
      ansible.builtin.command:
        cmd: oc get co ingress console image-registry -o wide
      register: key_operators_summary
      changed_when: false

    - name: Append raw check output to log
      ansible.builtin.blockinfile:
        path: "{{ validation_log }}"
        marker: "# {mark} RAW CHECK OUTPUT"
        block: |

          ==============================================
             CLUSTER OPERATORS
          ==============================================
          {{ operators_summary.stdout }}

          ==============================================
             NODES
          ==============================================
          {{ nodes_summary.stdout }}

          ==============================================
             MACHINECONFIGPOOLS
          ==============================================
          {{ mcp_summary.stdout }}

          ==============================================
             NON-RUNNING PODS (should be empty)
          ==============================================
          {{ pods_summary.stdout | default('None - all pods Running/Completed') }}

          ==============================================
             ETCD HEALTH (single member)
          ==============================================
          {{ etcd_health_summary.stdout | default(etcd_health_summary.stderr) }}

          ==============================================
             WARNING EVENTS
          ==============================================
          {{ events_summary.stdout | default('None') }}

          ==============================================
             INGRESS / CONSOLE / IMAGE-REGISTRY
          ==============================================
          {{ key_operators_summary.stdout }}

    - name: Validate ClusterVersion
      ansible.builtin.assert:
        that:
          - >
            (cluster_version.stdout | from_json).status.conditions
            | selectattr('type', 'equalto', 'Available')
            | map(attribute='status')
            | first == 'True'
          - >
            (cluster_version.stdout | from_json).status.conditions
            | selectattr('type', 'equalto', 'Progressing')
            | map(attribute='status')
            | first == 'False'
          - >
            (cluster_version.stdout | from_json).status.conditions
            | selectattr('type', 'equalto', 'Failing')
            | map(attribute='status')
            | first == 'False'
        fail_msg: "ClusterVersion post-upgrade validation FAILED."
        success_msg: "ClusterVersion post-upgrade validation PASSED."
      register: cv_validation
      ignore_errors: true

    - name: Validate Cluster Operators
      ansible.builtin.assert:
        that:
          - >
            item.status.conditions
            | selectattr('type', 'equalto', 'Available')
            | map(attribute='status')
            | first == 'True'
          - >
            item.status.conditions
            | selectattr('type', 'equalto', 'Progressing')
            | map(attribute='status')
            | first == 'False'
          - >
            item.status.conditions
            | selectattr('type', 'equalto', 'Degraded')
            | map(attribute='status')
            | first == 'False'
        fail_msg: "ClusterOperator {{ item.metadata.name }} FAILED post-upgrade validation."
        success_msg: "ClusterOperator {{ item.metadata.name }} PASSED."
      loop: "{{ (cluster_operators.stdout | from_json)['items'] }}"
      loop_control:
        label: "{{ item.metadata.name }}"
      register: co_validation
      ignore_errors: true

    - name: Validate Nodes
      ansible.builtin.assert:
        that:
          - >
            item.status.conditions
            | selectattr('type', 'equalto', 'Ready')
            | map(attribute='status')
            | first == 'True'
        fail_msg: "Node {{ item.metadata.name }} is NOT Ready."
        success_msg: "Node {{ item.metadata.name }} is Ready."
      loop: "{{ (cluster_nodes.stdout | from_json)['items'] }}"
      loop_control:
        label: "{{ item.metadata.name }}"
      register: node_validation
      ignore_errors: true

    - name: Validate MachineConfigPools
      ansible.builtin.assert:
        that:
          - >
            item.status.conditions
            | selectattr('type', 'equalto', 'Updated')
            | map(attribute='status')
            | first == 'True'
          - >
            item.status.conditions
            | selectattr('type', 'equalto', 'Degraded')
            | map(attribute='status')
            | first == 'False'
        fail_msg: "MachineConfigPool {{ item.metadata.name }} FAILED post-upgrade validation."
        success_msg: "MachineConfigPool {{ item.metadata.name }} PASSED."
      loop: "{{ (cluster_mcp.stdout | from_json)['items'] }}"
      loop_control:
        label: "{{ item.metadata.name }}"
      register: mcp_validation
      ignore_errors: true

    - name: Append validation results to log
      ansible.builtin.blockinfile:
        path: "{{ validation_log }}"
        marker: "# {mark} VALIDATION RESULTS"
        block: |

          ==============================================
             VALIDATION RESULTS
          ==============================================

          Cluster Version: {{ (cluster_version.stdout | from_json).status.desired.version }}

          ClusterVersion:      {{ 'PASSED' if not cv_validation.failed else 'FAILED' }}
          Cluster Operators:   {{ 'PASSED' if not co_validation.failed else 'FAILED' }}
          Nodes:               {{ 'PASSED' if not node_validation.failed else 'FAILED' }}
          MachineConfigPools:  {{ 'PASSED' if not mcp_validation.failed else 'FAILED' }}

          Run completed: {{ ansible_date_time.iso8601 }}
          ==============================================

    - name: Display validation summary
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "   OPENSHIFT SNO POST-UPGRADE VALIDATION"
          - "=============================================="
          - "Cluster Version: {{ (cluster_version.stdout | from_json).status.desired.version }}"
          - "ClusterVersion:      {{ 'PASSED' if not cv_validation.failed else 'FAILED' }}"
          - "Cluster Operators:   {{ 'PASSED' if not co_validation.failed else 'FAILED' }}"
          - "Nodes:               {{ 'PASSED' if not node_validation.failed else 'FAILED' }}"
          - "MachineConfigPools:  {{ 'PASSED' if not mcp_validation.failed else 'FAILED' }}"
          - "Log created: {{ validation_log }}"
          - "=============================================="

    - name: Fail play if any validation failed
      ansible.builtin.fail:
        msg: "One or more post-upgrade validations FAILED. Check {{ validation_log }} for details."
      when: >
        cv_validation.failed or
        co_validation.failed or
        node_validation.failed or
        mcp_validation.failed
