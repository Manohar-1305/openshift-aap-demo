---
- name: Diagnose Crashing Pod
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Get crashing pods
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: aap
      register: pods

    - name: Display crashing pods
      ansible.builtin.debug:
        msg: "{{ item.metadata.name }} - {{ item.status.containerStatuses | default([]) | map(attribute='state.waiting.reason') | list }}"
      loop: "{{ pods.resources }}"
      when:
        - item.status.containerStatuses is defined
        - item.status.containerStatuses | selectattr('state.waiting.reason', 'defined') | selectattr('state.waiting.reason', 'equalto', 'CrashLoopBackOff') | list | length > 0
