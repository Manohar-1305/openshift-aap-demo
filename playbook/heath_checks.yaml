---
- name: Diagnose Crashing Pod
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Get crashing pod
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: "{{ namespace }}"
        name: "{{ pod_name }}"
      register: crashing_pod

    - name: Display crashing pod
      ansible.builtin.debug:
        msg: "CRASHING PODS : {{ crashing_pod.resources[0].metadata.name }}"
