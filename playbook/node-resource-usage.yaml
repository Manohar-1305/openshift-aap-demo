---
- name: Get OpenShift Node CPU and Memory Usage
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Get node resource usage
      kubernetes.core.k8s_info:
        api_version: metrics.k8s.io/v1beta1
        kind: NodeMetrics
      register: node_metrics

    - name: Display CPU and memory usage
      ansible.builtin.debug:
        msg: |
          {% for node in node_metrics.resources %}
          Hostname     : {{ node.metadata.name }}
          CPU Usage    : {{ node.usage.cpu }}
          Memory Usage : {{ node.usage.memory }}
          {% endfor %}
