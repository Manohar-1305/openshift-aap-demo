---
- name: Get OpenShift Node CPU and Memory Usage
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Get node resource usage
      kubernetes.core.k8s_info:
        api_version: metrics.k8s.io/v1beta1
        kind: NodeMetrics
      register: node_metrics

    - name: Display CPU and memory usage
      ansible.builtin.debug:
        msg:
          node: "{{ item.metadata.name }}"
          cpu_usage: "{{ item.usage.cpu }}"
          memory_usage: "{{ item.usage.memory }}"
      loop: "{{ node_metrics.resources }}"
