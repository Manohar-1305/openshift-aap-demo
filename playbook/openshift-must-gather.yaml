---
- name: OpenShift Must-Gather
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Verify OpenShift authentication
      ansible.builtin.command:
        cmd: >
          oc login
          --server={{ lookup('env', 'K8S_AUTH_HOST') }}
          --token={{ lookup('env', 'K8S_AUTH_API_KEY') }}
          --insecure-skip-tls-verify=true
      register: oc_login
      changed_when: false
      no_log: true

    - name: Verify OpenShift user
      ansible.builtin.command:
        cmd: oc whoami
      register: oc_user
      changed_when: false

    - name: Display OpenShift user
      ansible.builtin.debug:
        msg: "Authenticated as: {{ oc_user.stdout }}"

    - name: Create Must-Gather directory
      ansible.builtin.file:
        path: /tmp/openshift-must-gather
        state: directory
        mode: "0755"

    - name: Run OpenShift Must-Gather
      ansible.builtin.command:
        cmd: oc adm must-gather --dest-dir=/tmp/openshift-must-gather
      register: must_gather
      changed_when: true

    - name: Display Must-Gather output
      ansible.builtin.debug:
        msg: "{{ must_gather.stdout_lines }}"

    - name: Display Must-Gather location
      ansible.builtin.debug:
        msg: "Must-Gather completed: /tmp/openshift-must-gather"
