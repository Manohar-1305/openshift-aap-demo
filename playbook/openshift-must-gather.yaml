---
- name: OpenShift Must-Gather
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Create kubeconfig directory
      ansible.builtin.file:
        path: /tmp/aap-kube
        state: directory
        mode: "0700"

    - name: Write CA certificate
      ansible.builtin.copy:
        dest: /tmp/aap-kube/ca.crt
        mode: "0600"
        content: "{{ lookup('env', 'K8S_AUTH_SSL_CA_CERT') }}"

    - name: Create kubeconfig
      ansible.builtin.copy:
        dest: /tmp/aap-kube/config
        mode: "0600"
        content: |
          apiVersion: v1
          kind: Config
          clusters:
          - name: openshift
            cluster:
              server: "{{ lookup('env', 'K8S_AUTH_HOST') }}"
              certificate-authority: /tmp/aap-kube/ca.crt
          users:
          - name: aap
            user:
              token: "{{ lookup('env', 'K8S_AUTH_API_KEY') }}"
          contexts:
          - name: openshift
            context:
              cluster: openshift
              user: aap
          current-context: openshift

    - name: Verify OpenShift authentication
      ansible.builtin.command:
        cmd: oc whoami
      environment:
        KUBECONFIG: /tmp/aap-kube/config

    - name: Create Must-Gather directory
      ansible.builtin.file:
        path: /tmp/openshift-must-gather
        state: directory
        mode: "0755"

    - name: Run OpenShift Must-Gather
      ansible.builtin.command:
        cmd: oc adm must-gather --dest-dir=/tmp/openshift-must-gather
      environment:
        KUBECONFIG: /tmp/aap-kube/config
      register: must_gather
      changed_when: true

    - name: Display Must-Gather output
      ansible.builtin.debug:
        var: must_gather.stdout_lines

    - name: Display Must-Gather location
      ansible.builtin.debug:
        msg: "Must-Gather completed: /tmp/openshift-must-gather"
