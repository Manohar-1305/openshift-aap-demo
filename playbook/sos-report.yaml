---
- name: Generate SOS Report for OpenShift Node
  hosts: all
  gather_facts: false

  vars:
    sos_report_dir: "/tmp/sos-reports"

  tasks:

    - name: Get OpenShift node name
      ansible.builtin.command:
        cmd: oc get nodes -o jsonpath='{.items[0].metadata.name}'
      register: node_name
      changed_when: false

    - name: Create SOS report directory on bastion
      ansible.builtin.file:
        path: "{{ sos_report_dir }}"
        state: directory
        mode: "0755"

    - name: Generate SOS report on OpenShift node
      ansible.builtin.command:
        cmd: >
          oc debug node/{{ node_name.stdout }} --
          chroot /host
          sos report
          --batch
      register: sos_report
      changed_when: true

    - name: Find generated SOS report
      ansible.builtin.shell:
        cmd: >
          oc debug node/{{ node_name.stdout }} --
          chroot /host
          find /var/tmp -maxdepth 1 -type f -name 'sosreport-*'
      register: sos_files
      changed_when: false

    - name: Copy SOS report from node to bastion
      ansible.builtin.shell:
        cmd: |
          oc debug node/{{ node_name.stdout }} -- \
            chroot /host \
            cat "{{ item }}" > "{{ sos_report_dir }}/{{ item | basename }}"
      loop: "{{ sos_files.stdout_lines }}"
      when: sos_files.stdout_lines | length > 0
      changed_when: true

    - name: Display SOS report location
      ansible.builtin.debug:
        msg: "SOS report saved on bastion: {{ sos_report_dir }}"
