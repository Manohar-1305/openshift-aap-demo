---
- name: OpenShift Cluster SOS Report
  hosts: all
  gather_facts: false

  vars:
    sos_report_dir: "/tmp/sos-report-{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"

  tasks:

    - name: Verify OpenShift access
      ansible.builtin.command:
        cmd: oc whoami
      register: oc_user
      changed_when: false

    - name: Verify cluster access
      ansible.builtin.command:
        cmd: oc get clusterversion
      register: cluster_version
      changed_when: false

    - name: Create SOS report directory
      ansible.builtin.file:
        path: "{{ sos_report_dir }}"
        state: directory
        mode: "0755"

    - name: Run OpenShift diagnostic collection
      ansible.builtin.command:
        cmd: >
          oc adm inspect clusteroperators
          --dest-dir="{{ sos_report_dir }}"
      register: sos_report
      changed_when: true

    - name: Collect cluster resources
      ansible.builtin.command:
        cmd: >
          oc adm inspect nodes
          --dest-dir="{{ sos_report_dir }}"
      register: cluster_resources
      changed_when: true

    - name: Verify diagnostic output
      ansible.builtin.find:
        paths: "{{ sos_report_dir }}"
        recurse: true
      register: report_files

    - name: Fail when diagnostic output is empty
      ansible.builtin.fail:
        msg: "Diagnostic collection did not produce any data."
      when: report_files.matched | int == 0

    - name: Create SOS report archive
      ansible.builtin.command:
        cmd: >
          tar -czf "{{ sos_report_dir }}.tar.gz"
          -C "{{ sos_report_dir | dirname }}"
          "{{ sos_report_dir | basename }}"
      changed_when: true

    - name: Report SOS report result
      ansible.builtin.debug:
        msg:
          - "Cluster: {{ cluster_version.stdout }}"
          - "Authenticated user: {{ oc_user.stdout }}"
          - "SOS report: {{ sos_report_dir }}.tar.gz"
