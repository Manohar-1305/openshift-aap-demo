---
- name: Generate SOS Report for OpenShift Node
  hosts: all
  gather_facts: false

  vars:
    sos_report_dir: "/tmp/sos-reports"

  tasks:

    - name: Get OpenShift node name
      ansible.builtin.command:
        cmd: oc get nodes -o jsonpath='{.items[0].metadata.name}'
      register: node_name
      changed_when: false

    - name: Create SOS report directory on bastion
      ansible.builtin.file:
        path: "{{ sos_report_dir }}"
        state: directory
        mode: "0755"

    - name: Generate SOS report on OpenShift node
      ansible.builtin.command:
        cmd: >
          oc debug node/{{ node_name.stdout }}
          -- bash -c
          "chroot /host toolbox sos report
          -e openshift
          -e openshift_ovn
          -e openvswitch
          -e podman
          -e crio
          -k crio.all=on
          -k crio.logs=on
          -k podman.all=on
          -k podman.logs=on
          -k networking.ethtool-namespaces=off
          --all-logs
          --plugin-timeout=600"
      register: sos_report
      changed_when: true

    - name: Display SOS report output
      ansible.builtin.debug:
        var: sos_report.stdout_lines
