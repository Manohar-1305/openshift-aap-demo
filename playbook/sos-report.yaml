---
- name: Generate SOS Report for OpenShift Node
  hosts: all
  gather_facts: false

  vars:
    sos_report_dir: "/tmp/sos-reports"

  tasks:

    - name: Get OpenShift node name
      ansible.builtin.command:
        cmd: oc get nodes -o jsonpath='{.items[0].metadata.name}'
      register: node_name
      changed_when: false

    - name: Create SOS report directory on bastion
      ansible.builtin.file:
        path: "{{ sos_report_dir }}"
        state: directory
        mode: "0755"

    - name: Generate SOS report
      ansible.builtin.command:
        cmd: >
          oc debug node/{{ node_name.stdout }}
          --image=registry.redhat.io/rhel9/support-tools
          -- chroot /host
          sos report
          --batch
      register: sos_report
      changed_when: true

    - name: Display SOS report result
      ansible.builtin.debug:
        var: sos_report.stdout_lines
