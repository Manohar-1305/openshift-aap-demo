# Image Pull BackOff
---
- name: Diagnose Image Pull BackOff Pod
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Get image pull error pod
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: aap
        name: image-error-test
      register: image_error_pod

    - name: Display image pull error pod
      ansible.builtin.debug:
        msg: "IMAGE PULL ERROR : image-error-test"
